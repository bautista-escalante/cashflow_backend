name: CI

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "import os; url=os.getenv('DATABASE_URL'); print('DATABASE_URL existe:', bool(url)); print('Longitud:', len(url) if url else 0); print('Inicio:', url[:20] if url else 'NONE')"
      
      - name: Validate DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "import os; from sqlalchemy.engine import make_url; url=make_url(os.environ['DATABASE_URL']); print('Driver:', url.drivername); print('Host:', url.host); print('Port:', url.port); print('Database:', url.database)"

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pytest -v