name: CI

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "import os; url=os.getenv('DATABASE_URL'); print('DATABASE_URL existe:', bool(url)); print('Longitud:', len(url) if url else 0); print('Inicio:', url[:20] if url else 'NONE')"
      
      - name: Validate DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "import os; from urllib.parse import urlparse; u=urlparse(os.environ['DATABASE_URL']); print('Scheme:', repr(u.scheme)); print('Has netloc:', bool(u.netloc)); print('Has path:', bool(u.path)); print('Starts with postgresql:', os.environ['DATABASE_URL'].startswith('postgresql://')); print('Starts with postgres:', os.environ['DATABASE_URL'].startswith('postgres://'));"

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pytest -v